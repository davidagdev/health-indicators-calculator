<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC </title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css"></style>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Datos personales</legend>
            <label for="Genero">Género:</label>
            <select name="Genero" id="Genero">
                <option value="Hombre">Hombre</option>
                <option value="Mujer">Mujer</option>
            </select>
            <label for="Edad">Edad:</label>
            <input type="number" name="Edad" id="Edad" placeholder="30">
        </fieldset>
        <fieldset>
            <legend>Frecuencia Cardíaca (FC)</legend>
            <label for="FCb">Frecuencia Cardíaca Basal (FCb):</label>
            <input type="number" name="FCb" id="FCb" placeholder="60">
            <fieldset>
                <legend>Frecuencia Cardíaca Máxima (FCmax)</legend>
                <button type="button">Calcular</button>
            </fieldset>
            <fieldset>
                <legend>Frecuencia Cardíaca Entrenamiento</legend>
                <button type="button">Calcular</button>
                <output id="Aero_Regenerativo"></output>
                <output id="Aero_Lipolítico"></output>
                <output id="Aero_Glucolítico"></output>
                <output id="Mixto extensivo"></output>
                <output id="Mixto intensivo"></output>
                <output id="Anae_Lact_Extensivo"></output>
                <output id="Anae_Lact_Intensivo"></output>
                <output id="Anae_Alac__Extensivo"></output>
                <output id="Anae_Alac__Intensivo"></output>
                <output id="Neural"></output>
            </fieldset>
        </fieldset>
        <fieldset>
            <legend>Tensión Arterial (TA)</legend>
            <fieldset>
                <legend>Sistólica(S)</legend>
                <label for="Sistolica">(en milímetros de mercurio o mmHg):</label>
                <input type="number" name="Peso" id="Sistolica" step="any" placeholder="66.8">
                <output id="resultadoTAS"></output>
            </fieldset>
            <fieldset>
                <legend>Diastólica(D)</legend>
                <label for="Diastolica">(en milímetros de mercurio o mmHg):</label>
                <input type="number" name="Peso" id="Diastolica" step="any" placeholder="66.8">
                <output id="resultadoTAD"></output>
            </fieldset>
            <button type="button" id="CalculaTA"> Calcular TA</button>
        </fieldset>
        <fieldset>
            <legend>Indice de Masa Corporal (IMC)</legend>
            <label for="Peso">Peso (en kilogramos):</label>
            <input type="number" name="Peso" id="Peso" step="any" placeholder="66.8">
            <label for="Altura">Altura (en metros):</label>
            <input type="number" name="Altura" id="Altura" step="any" placeholder="1.80">
            <button type="button" id="CalculaIMC"> Calcular IMC</button>
            <output id="resultadoIMC"></output>
        </fieldset>
        <fieldset>
            <legend>Índice Cintura-Cadera (ICC)</legend>
            <label for="Cintura">Perímetor cíntura (en centímetros):</label>
            <input type="number" name="Cintura" id="Cintura" step="any" placeholder="60.0">
            <label for="Cadera">Perímetro cadera (en centímetros):</label>
            <input type="number" name="Cadera" id="Cadera" step="any" placeholder="60.0">
            <button type="button" id="CalculaICC">Calcula ICC</button>
            <output id="resultadoICC"></output>
        </fieldset>
        <fieldset>
            <legend>Antropometría</legend>
            <fieldset>
                <legend>Pliegues</legend>
                <label for="Bicipital">Bicipital:</label>
                <input type="number" name="Bicipital" id="Bicipital" step="any" placeholder="12.7">
                <label for="Tricipital">Tricipital:</label>
                <input type="number" name="Tricipital" id="Tricipital" step="any" placeholder="12.7">
                <label for="Subescapular">Subescapular:</label>
                <input type="number" name="Subescapular" id="Subescapular" step="any" placeholder="17.0">
                <label for="Suprailiaco">Suprailíaco:</label>
                <input type="number" name="Suprailiaco" id="Suprailiaco" step="any" placeholder="22.2">
                <label for="Abdominal">Abdominal:</label>
                <input type="number" name="Abdominal" id="Abdominal" step="any" placeholder="29.8">
                <label for="Muslo">Muslo:</label>
                <input type="number" name="Muslo" id="Muslo" step="any" placeholder="20.8">
                <label for="Pierna">Pierna:</label>
                <input type="number" name="Pierna" id="Pierna" step="any" placeholder="12.6">
            </fieldset>
            <fieldset>
                <legend>Diámetros</legend>
                <label for="Biestiloieo">Biestiloieo:</label>
                <input type="number" name="Biestiloieo" id="Biestiloieo" step="any" placeholder="6.1">
                <label for="Humero">Biepicondíleo húmero:</label>
                <input type="number" name="Humero" id="Humero" step="any" placeholder="7.5">
                <label for="Femur">Biepicondíleo fémur</label>
                <input type="number" name="Femur" id="Femur" step="any" placeholder="10.5">
            </fieldset>
            <fieldset>
                <legend>Perímetros</legend>
                <label for="Antebrazo">Antebrazo:</label>
                <input type="number" name="Antebrazo" id="Antebrazo" step="any" placeholder="26.3">
                <label for="Brazo">Brazo contraído:</label>
                <input type="number" name="Brazo" id="Brazo" step="any" placeholder="32.9">
                <label for="PMuslo">Muslo:</label>
                <input type="number" name="PMuslo" id="PMuslo" step="any" placeholder="61.2">
                <label for="PPierna">Pierna:</label>
                <input type="number" name="PPierna" id="PPierna" step="any" placeholder="41.2">
                <label for="Pecho">Pecho:</label>
                <input type="number" name="Pecho" id="Pecho" step="any" placeholder="60.0">
                <label for="Cintura">Perímetor cíntura:</label>
                <input type="number" name="Cintura" id="Cintura2" step="any" placeholder="60.0">
                <label for="Cadera">Perímetro cadera:</label>
                <input type="number" name="Cadera" id="Cadera2" step="any" placeholder="60.0">
            </fieldset>
            <output id="resultadoAntropometria"></output>
            <button type="button" id="Antropometría">Calcular Antropometría</button>
        </fieldset>
        <button type="button" id="all">Calcular todo</button>
        <button type="button" id="reset">Limpiar datos</button>
    </form>
</body>
</html>
